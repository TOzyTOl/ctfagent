name: half-truths
category: crypto
description: |
  Cryovault 2026 Quals（2026-10-10）。

  327 of my 512 friends lied to me. Reconstruct the secret anyway.

  chall.py 里的 load_flag() 兜底值 b"isfcr{REDACTED}" 是出题人留的占位符，
  不是答案；真正的 flag 在 output.json 的 flag_ct 里，用推导出的密钥做
  AES-GCM 解密得到。
flag_format: "isfcr\{(?!REDACTED\})[^}]+\}"
source: materials
time_limit_s: 3600
hints:
  - 纠错码的经典唯一解码半径盖不住这个错误率，需要列表解码
