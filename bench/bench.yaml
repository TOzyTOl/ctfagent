# 基准集：只收录答案已经确知、且答案不随运行变化的题。
#
# 三条规则：
#  * 每次运行都用全新的数据库，基准运行的结果不会变成战例卡反过来喂给下一次；
#  * 判分只认「提交的 flag 与 expect 相符」，不认置信度、不认「差一点」；
#  * 答案不能随附件发给解题者。题目的 source 指向一份干净的材料副本，
#    原始目录（里面往往躺着求解脚本和已经恢复出来的答案）用 sealed 封掉。
#
# 2026-10-24 起扩到 8 题：除 easyrs / n17 外的 6 道是自造题，题目材料在
# bench/challenges/ 下，生成器与答案在 bench/sealed/ 下（本目录整体对 worker
# 封禁，无需逐条 sealed）。它们是确定性生成的（固定种子 + gmpy2.next_prime），
# 每道都附带 solve.py 在生成时验证过「从材料出发、不借助答案」可解；crackme_z3
# 的口令唯一性用 z3 证明。自造题不要在正常训练中跑：它们的战例卡一旦进训练库，
# 基准分数测的就是记忆而不是能力。
#
# 不进基准集的题：
#  * pier-beacon 里的 flag 是诱饵，答案没有独立验证过——拿错答案判分比不判分更糟；
#  * ooops 同样没有独立验证过的答案；
#  * silentrotor 需要连 172.22.124.196:9999 的交互服务（当前不可达），
#    离线无法重现答案；且原始目录的 final.txt 就是答案本身。
items:
  - name: easyrs
    directory: ../challenges/easyrs
    category: reverse
    expect: 96b30dd3d5f0ec32ecdf3147fe8d39ce
    # 源目录只有 easyrs.exe 和 pdb，没有答案文件，不需要封。
    note: 运行时被改写为 AES-128-ECB；上一轮曾误入 RC4 死胡同

  - name: n17
    directory: ../challenges/n17
    category: crypto
    expect: 8a6179153fd89b40b1eac51e3bc6825f
    # 原始目录里 answer.json 就是答案，solve.py 是完整解法。
    sealed: "D:/agentsec/ctf_n17"
    note: nonce 复用；附件是筛选过的材料副本，不含 answer.json/solve.py

  # ---------------- 自造题（2026-10-24，难度从易到难） ----------------

  - name: lcg_step
    directory: challenges/lcg_step
    category: crypto
    expect: 987654321
    note: 锚点题——一次模逆；平台解不出它就是回归警报

  - name: aes_pin
    directory: challenges/aes_pin
    category: crypto
    expect: flag{6_d1g1t_p1n_1s_n0t_a_k3y}
    note: 10^6 键空间爆破，考的是识别密钥空间而不是密码学强度

  - name: rsa_broadcast
    directory: challenges/rsa_broadcast
    category: crypto
    expect: flag{h4st4d_sh0rt_p4d}
    note: Håstad 广播，CRT + 整数立方根

  - name: crackme_z3
    directory: challenges/crackme_z3
    category: reverse
    expect: Z3s0lv3sTh3K3y!!
    note: 16 位口令约束系统，唯一性由 z3 在生成时证明

  - name: rsa_wiener
    directory: challenges/rsa_wiener
    category: crypto
    expect: flag{w13n3r_l0v3s_sm4ll_d}
    note: 连分数 Wiener 攻击，纯 Python 可解

  - name: sha256_ext
    directory: challenges/sha256_ext
    category: crypto
    expect: c4f527442d6df01079f7608d9561ad741808ddf8a8c8fb4ca0288ee816941892
    note: SHA-256 长度扩展伪造，需手写状态注入
